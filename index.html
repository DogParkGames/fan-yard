<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fan Yard: Pick the Winner, Call the Margin</title>
<meta name="description" content="Fan Yard is a free sports pick'em game. Pick the winner, call the margin, chase Direct Hits across the NFL, NBA, College Football, College Basketball and the NHL. Live scores, the Yardstick, your Score Card and the Yard Board.">
<meta property="og:title" content="Fan Yard">
<meta property="og:description" content="Pick the winner. Call the margin. Measure up against the Yardstick.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171c; --panel:#1d2129; --panel2:#232833; --line:#313947;
  --ink:#f2f4f6; --mut:#9aa6b5; --green:#2fbf71; --green-d:#1d7a47;
  --gold:#f2c14e; --red:#ff5252; --blue:#57a8ff;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:Nunito,system-ui,sans-serif; min-height:100vh;
  background-image:repeating-linear-gradient(0deg, transparent, transparent 47px, rgba(255,255,255,.014) 48px);}
.wrap{max-width:860px; margin:0 auto; padding:0 14px 60px}
header.top{text-align:center; padding:26px 10px 8px}
.logo{font-family:Oswald,sans-serif; font-size:clamp(38px,8vw,58px); font-weight:700; letter-spacing:2px; line-height:1}
.logo .y{color:var(--green)}
.tagline{color:var(--mut); font-weight:700; margin-top:6px; font-size:15px}
.tagline b{color:var(--gold)}
nav.sports{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:18px 0 6px}
nav.sports button{font-family:Oswald,sans-serif; font-size:16px; letter-spacing:1px; padding:10px 16px; border-radius:999px;
  border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer}
nav.sports button.on{background:var(--green); border-color:var(--green); color:#08130c; font-weight:700}
nav.sports button.live.on{background:var(--red); border-color:var(--red); color:#fff}
nav.sports button .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--red); margin-right:6px; animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.updated{text-align:center; color:var(--mut); font-size:12.5px; margin:8px 0 14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:16px; padding:16px; margin:0 0 14px}
.game{padding:14px 16px}
.teams{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center}
.team{text-align:center}
.team .abbr{font-family:Oswald,sans-serif; font-size:26px; font-weight:700; letter-spacing:1px}
.team .tname{color:var(--mut); font-size:12.5px; font-weight:700; line-height:1.25}
.team .score{font-family:Oswald,sans-serif; font-size:30px; color:var(--gold)}
.center{text-align:center; min-width:86px}
.center .ys{font-family:Oswald,sans-serif; font-size:24px; color:var(--ink)}
.center .yslab{font-size:10px; letter-spacing:2px; color:var(--mut); font-weight:900}
.center .vs{font-family:Oswald,sans-serif; color:var(--mut); font-size:18px}
.meta{text-align:center; color:var(--mut); font-size:13px; font-weight:700; margin-top:8px}
.meta .live{color:var(--red)}
.meta .fin{color:var(--ink)}
.pickbox{margin-top:12px; border-top:1px dashed var(--line); padding-top:12px}
.pickbtns{display:flex; gap:8px; justify-content:center}
.pickbtns button{flex:1; max-width:220px; padding:10px; border-radius:10px; border:2px solid var(--line); background:#171b22; color:var(--ink);
  font-family:Oswald,sans-serif; font-size:16px; letter-spacing:.5px; cursor:pointer}
.pickbtns button.on{border-color:var(--green); background:rgba(47,191,113,.16); color:#fff}
.marginrow{display:flex; align-items:center; gap:12px; margin-top:12px}
.marginrow input[type=range]{flex:1; accent-color:var(--green); height:28px}
.marginval{font-family:Oswald,sans-serif; font-size:22px; min-width:44px; text-align:center; color:var(--gold)}
.pickread{text-align:center; font-weight:800; margin-top:8px; font-size:15px}
.pickread .saved{color:var(--green); font-size:12px; margin-left:8px}
.result{margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; text-align:center; font-weight:800}
.pts{display:inline-block; padding:3px 12px; border-radius:999px; background:#2a3040; font-family:Oswald,sans-serif; margin-left:8px}
.pts.dh{background:var(--gold); color:#221a04}
.bars{margin-top:10px; text-align:left}
.bar{display:grid; grid-template-columns:74px 1fr 30px; gap:8px; align-items:center; font-size:12px; font-weight:800; color:var(--mut); margin:3px 0}
.bar .track{height:10px; background:#12151a; border-radius:6px; overflow:hidden}
.bar .fill{height:100%; border-radius:6px}
.bar .v{color:var(--ink); text-align:right}
h2.sec{font-family:Oswald,sans-serif; letter-spacing:1.5px; font-size:20px; margin:20px 0 10px}
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{padding:8px 6px; text-align:center; border-bottom:1px solid var(--line)}
th{color:var(--mut); font-size:11.5px; letter-spacing:1px}
td:first-child,th:first-child{text-align:left}
.statbar{display:grid; grid-template-columns:110px 1fr 44px; gap:8px; align-items:center; font-size:13px; font-weight:800; margin:5px 0}
.statbar .track{height:12px; background:#12151a; border-radius:6px; overflow:hidden}
.statbar .fill{height:100%; background:var(--green)}
.statbar .v{text-align:right; font-family:Oswald,sans-serif}
input[type=text]{width:100%; padding:11px; border-radius:10px; border:2px solid var(--line); background:#12151a; color:var(--ink); font-size:15px; font-weight:700}
.btn{display:inline-block; padding:11px 18px; border-radius:10px; border:none; background:var(--green); color:#08130c; font-weight:900; font-size:15px; cursor:pointer; margin-top:10px}
.btn.ghost{background:var(--panel2); color:var(--ink); border:2px solid var(--line)}
.btn.small{padding:8px 13px; font-size:13.5px}
.rankline{font-family:Oswald,sans-serif; font-size:19px; letter-spacing:.5px}
.rankline b{color:var(--gold)}
.trophies{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:10px}
.trophy{background:#12151a; border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center}
.trophy .emo{font-size:28px}
.trophy .tname{font-weight:900; font-size:13px; margin-top:4px}
.trophy .tdesc{color:var(--mut); font-size:11.5px; font-weight:700}
.trophy.locked{opacity:.38; filter:grayscale(1)}
.mut{color:var(--mut)} .small{font-size:13px}
.err{background:#3a1d1d; border:1px solid #6e3434; color:#ffb3b3; border-radius:12px; padding:14px; text-align:center; font-weight:800}
footer{text-align:center; color:var(--mut); font-size:12.5px; margin-top:26px; line-height:1.6}
.sharebox{white-space:pre-wrap; background:#12151a; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:13.5px; margin-top:10px; display:none}
@media (max-width:560px){ .team .abbr{font-size:21px} .center{min-width:64px} .center .ys{font-size:19px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">FAN <span class="y">YARD</span></div>
    <div class="tagline">Pick the winner. Call the margin. <b>Measure up.</b></div>
  </header>
  <nav class="sports" id="sportNav"></nav>
  <div class="updated" id="updatedLine">Loading games...</div>
  <main id="view"></main>
  <footer>
    Fan Yard by BizzyBullets. A revival of the classic pick'em yard, rebuilt for today's fan.<br>
    Free to play, bragging rights only. Scores and schedules update live from the ESPN feed.
  </footer>
</div>
<script>
"use strict";

const SPORTS = {
  NFL:  {label:"NFL", path:"football/nfl", max:45},
  NBA:  {label:"NBA", path:"basketball/nba", max:45},
  NCAAF:{label:"COLLEGE FOOTBALL", path:"football/college-football", max:55},
  NCAAB:{label:"COLLEGE BASKETBALL", path:"basketball/mens-college-basketball", max:45},
  NHL:  {label:"NHL", path:"hockey/nhl", max:8}
};
const API = "https://site.api.espn.com/apis/site/v2/sports/";
const SAVE_KEY = "fySaveV1";
let save = loadSave();
let view = "NFL"; // sport key, "LIVE", or "YARD"
let feed = {};    // sport -> {events:[], at:Date, error:bool}
let refreshTimer = null;

function loadSave(){
  try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if(s && s.picks) return s; }catch(e){}
  return {name:"", picks:{}, board:[]};
}
function store(){ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function weekKey(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - day + 3);
  const firstThu = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
  const fday = (firstThu.getUTCDay() + 6) % 7;
  firstThu.setUTCDate(firstThu.getUTCDate() - fday + 3);
  const wk = 1 + Math.round((date - firstThu) / (7 * 24 * 3600 * 1000));
  return date.getUTCFullYear() + "-W" + String(wk).padStart(2, "0");
}
function parseYardstick(ev){
  // ev.oddsDetails like "TTU -15.5" -> {abbr:"TTU", margin:15.5}; side resolved by caller
  if(!ev.oddsDetails) return null;
  const m = String(ev.oddsDetails).match(/^([A-Z0-9]+)\s+-(\d+(?:\.\d+)?)$/);
  if(!m) return null;
  return {abbr:m[1], margin:parseFloat(m[2])};
}
function normalizeEvent(raw, sport){
  const comp = (raw.competitions || [])[0] || {};
  const cs = comp.competitors || [];
  const home = cs.find(c => c.homeAway === "home") || {};
  const away = cs.find(c => c.homeAway === "away") || {};
  const st = (raw.status && raw.status.type) || {};
  const odds = (comp.odds || [])[0] || {};
  const ev = {
    id: String(raw.id), sport: sport,
    date: raw.date, name: raw.name || "",
    state: st.state || "pre",
    completed: !!st.completed,
    detail: st.shortDetail || st.detail || "",
    clock: (raw.status && raw.status.displayClock) || "",
    period: (raw.status && raw.status.period) || 0,
    home: {abbr:(home.team||{}).abbreviation || "HOME", name:(home.team||{}).displayName || "Home", score: home.score === "" || home.score == null ? null : parseInt(home.score, 10), winner: !!home.winner},
    away: {abbr:(away.team||{}).abbreviation || "AWAY", name:(away.team||{}).displayName || "Away", score: away.score === "" || away.score == null ? null : parseInt(away.score, 10), winner: !!away.winner},
    oddsDetails: odds.details || null
  };
  const ys = parseYardstick(ev);
  if(ys){
    if(ys.abbr === ev.home.abbr) ev.yardstick = {side:"home", margin:ys.margin};
    else if(ys.abbr === ev.away.abbr) ev.yardstick = {side:"away", margin:ys.margin};
  }
  return ev;
}
async function fetchSport(sport){
  try{
    const r = await fetch(API + SPORTS[sport].path + "/scoreboard");
    if(!r.ok) throw new Error("feed");
    const data = await r.json();
    const events = (data.events || []).map(e => normalizeEvent(e, sport));
    feed[sport] = {events: events, at: new Date(), error:false};
    gradeAll(events);
  }catch(e){
    feed[sport] = {events: (feed[sport] || {}).events || [], at: new Date(), error:true};
  }
}
function gradePick(pick, ev){
  if(pick.pts !== null && pick.pts !== undefined) return;
  if(ev.home.score === null || ev.away.score === null) return;
  let winnerSide = null;
  if(ev.home.winner || ev.home.score > ev.away.score) winnerSide = "home";
  else if(ev.away.winner || ev.away.score > ev.home.score) winnerSide = "away";
  const actualMargin = Math.abs(ev.home.score - ev.away.score);
  let pts = 0, dh = false;
  if(winnerSide && pick.side === winnerSide){
    const err = Math.abs(pick.margin - actualMargin);
    if(err <= 10){ pts = 100 - 10 * err; dh = (err === 0); }
  }
  pick.pts = pts; pick.dh = dh; pick.actualMargin = actualMargin; pick.winnerSide = winnerSide;
  pick.finalScore = ev.away.abbr + " " + ev.away.score + " at " + ev.home.abbr + " " + ev.home.score;
  store();
}
function gradeAll(events){
  for(const ev of events){
    if(ev.state === "post" && ev.completed){
      const p = save.picks[ev.id];
      if(p && (p.pts === null || p.pts === undefined)) gradePick(p, ev);
    }
  }
}

function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}) + " · " +
         d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}
function marginBars(pick, ev){
  const rows = [];
  const ys = ev.yardstick ? ev.yardstick.margin : null;
  const act = pick.actualMargin;
  const max = Math.max(10, pick.margin, act || 0, ys || 0);
  function row(label, val, color){
    if(val === null || val === undefined) return "";
    return '<div class="bar"><span>' + label + '</span><span class="track"><span class="fill" style="display:block;width:' +
      Math.round(100 * val / max) + '%;background:' + color + '"></span></span><span class="v">' + val + '</span></div>';
  }
  rows.push(row("YOUR CALL", pick.margin, "var(--green)"));
  if(ys !== null) rows.push(row("YARDSTICK", ys, "var(--blue)"));
  rows.push(row("ACTUAL", act, "var(--gold)"));
  return '<div class="bars">' + rows.join("") + '</div>';
}
function gameCard(ev){
  const pick = save.picks[ev.id];
  const started = ev.state !== "pre";
  const live = ev.state === "in";
  const fin = ev.state === "post";
  let center;
  if(fin || live){
    center = '<div class="ys">' + (ev.away.score ?? "-") + " · " + (ev.home.score ?? "-") + '</div><div class="yslab">' + (fin ? "FINAL" : "LIVE") + '</div>';
  } else if(ev.yardstick){
    const fav = ev.yardstick.side === "home" ? ev.home : ev.away;
    center = '<div class="ys">' + fav.abbr + " by " + ev.yardstick.margin + '</div><div class="yslab">YARDSTICK</div>';
  } else {
    center = '<div class="vs">VS</div><div class="yslab">NO LINE</div>';
  }
  let meta;
  if(live) meta = '<span class="live">● LIVE</span> · ' + esc(ev.detail);
  else if(fin) meta = '<span class="fin">Final</span> · ' + fmtTime(ev.date);
  else meta = fmtTime(ev.date) + (ev.yardstick ? ' · <span class="mut">The Yardstick (the line): ' + esc(ev.oddsDetails) + '</span>' : '');
  let body = "";
  if(!started){
    const side = pick ? pick.side : null;
    const mg = pick ? pick.margin : Math.min(7, SPORTS[ev.sport].max);
    body = '<div class="pickbox">' +
      '<div class="pickbtns">' +
        '<button data-pick="' + ev.id + '" data-side="away" class="' + (side === "away" ? "on" : "") + '">' + esc(ev.away.abbr) + ' wins</button>' +
        '<button data-pick="' + ev.id + '" data-side="home" class="' + (side === "home" ? "on" : "") + '">' + esc(ev.home.abbr) + ' wins</button>' +
      '</div>' +
      '<div class="marginrow"><span class="small mut" style="font-weight:900">BY</span>' +
        '<input type="range" min="1" max="' + SPORTS[ev.sport].max + '" value="' + mg + '" data-margin="' + ev.id + '">' +
        '<span class="marginval" id="mv-' + ev.id + '">' + mg + '</span></div>' +
      '<div class="pickread" id="pr-' + ev.id + '">' + (pick ? 'Your pick: <b>' + esc(pick.side === "home" ? ev.home.abbr : ev.away.abbr) + ' to win by ' + pick.margin + '</b><span class="saved">saved</span>' : 'Tap a winner, then set the margin.') + '</div>' +
    '</div>';
  } else if(fin && pick && pick.pts !== null && pick.pts !== undefined){
    body = '<div class="result">You called ' + esc(pick.side === "home" ? ev.home.abbr : ev.away.abbr) + ' by ' + pick.margin + ' · Actual margin ' + pick.actualMargin +
      '<span class="pts' + (pick.dh ? " dh" : "") + '">' + (pick.dh ? "🏆 DIRECT HIT · " : "") + pick.pts + ' PTS</span></div>' + marginBars(pick, ev);
  } else if(fin && pick){
    body = '<div class="result mut">Grading your pick...</div>';
  } else if(live && pick){
    body = '<div class="result">Your pick: ' + esc(pick.side === "home" ? ev.home.abbr : ev.away.abbr) + ' to win by ' + pick.margin + '</div>';
  }
  return '<div class="card game"><div class="teams">' +
    '<div class="team"><div class="abbr">' + esc(ev.away.abbr) + '</div><div class="tname">' + esc(ev.away.name) + '</div></div>' +
    '<div class="center">' + center + '</div>' +
    '<div class="team"><div class="abbr">' + esc(ev.home.abbr) + '</div><div class="tname">' + esc(ev.home.name) + '</div></div>' +
    '</div><div class="meta">' + meta + '</div>' + body + '</div>';
}
function renderNav(){
  const nav = document.getElementById("sportNav");
  let h = "";
  for(const k of Object.keys(SPORTS)){
    h += '<button data-view="' + k + '" class="' + (view === k ? "on" : "") + '">' + SPORTS[k].label + '</button>';
  }
  h += '<button data-view="LIVE" class="live ' + (view === "LIVE" ? "on" : "") + '"><span class="dot"></span>LIVE</button>';
  h += '<button data-view="YARD" class="' + (view === "YARD" ? "on" : "") + '">MY YARD</button>';
  nav.innerHTML = h;
  nav.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { view = b.dataset.view; refresh(true); }));
}
function setUpdated(){
  const el = document.getElementById("updatedLine");
  const times = Object.values(feed).filter(f => f.at).map(f => f.at.getTime());
  if(!times.length){ el.textContent = "Loading games..."; return; }
  const latest = new Date(Math.max.apply(null, times));
  el.textContent = "Scores and schedules update live · Last updated " + latest.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", second:"2-digit"});
}
function renderSport(sport){
  const f = feed[sport];
  const v = document.getElementById("view");
  if(!f){ v.innerHTML = '<div class="card">Loading the ' + SPORTS[sport].label + ' yard...</div>'; return; }
  if(f.error && !f.events.length){ v.innerHTML = '<div class="err">The score feed did not answer. Your picks are safe.<br><button class="btn small" onclick="refresh(true)">Try again</button></div>'; return; }
  if(!f.events.length){ v.innerHTML = '<div class="card">No games on the board right now for ' + SPORTS[sport].label + '. Check back on game day.</div>'; return; }
  const sorted = f.events.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  v.innerHTML = sorted.map(gameCard).join("");
  wirePickControls(v);
}
function renderLive(){
  const v = document.getElementById("view");
  let live = [];
  for(const k of Object.keys(SPORTS)){ for(const ev of (feed[k] || {}).events || []) if(ev.state === "in") live.push(ev); }
  if(!live.length){ v.innerHTML = '<div class="card" style="text-align:center"><b>No games are live this minute.</b><br><span class="mut">When a game tips off, kicks off or drops the puck, it shows up here with the score and clock, refreshing on its own.</span></div>'; return; }
  v.innerHTML = '<h2 class="sec">LIVE SCORING WATCH</h2>' + live.map(gameCard).join("");
  wirePickControls(v);
}
function wirePickControls(root){
  root.querySelectorAll("[data-pick]").forEach(btn => btn.addEventListener("click", () => {
    const id = btn.dataset.pick, side = btn.dataset.side;
    const ev = findEvent(id); if(!ev) return;
    const slider = root.querySelector('[data-margin="' + id + '"]');
    const margin = slider ? parseInt(slider.value, 10) : (save.picks[id] ? save.picks[id].margin : 7);
    savePick(ev, side, margin);
    refresh(false);
  }));
  root.querySelectorAll("[data-margin]").forEach(sl => sl.addEventListener("input", () => {
    const id = sl.dataset.margin;
    const mv = document.getElementById("mv-" + id); if(mv) mv.textContent = sl.value;
    const p = save.picks[id];
    if(p){ p.margin = parseInt(sl.value, 10); store(); const pr = document.getElementById("pr-" + id); if(pr) pr.innerHTML = 'Your pick: <b>' + esc(p.side === "home" ? p.homeAbbr : p.awayAbbr) + ' to win by ' + p.margin + '</b><span class="saved">saved</span>'; }
  }));
}
function findEvent(id){
  for(const k of Object.keys(feed)){ const ev = (feed[k].events || []).find(e => e.id === id); if(ev) return ev; }
  return null;
}
function savePick(ev, side, margin){
  save.picks[ev.id] = {
    sport: ev.sport, side: side, margin: margin,
    awayAbbr: ev.away.abbr, homeAbbr: ev.home.abbr,
    awayName: ev.away.name, homeName: ev.home.name,
    date: ev.date, week: weekKey(new Date(ev.date)),
    pts: null, dh: false
  };
  store();
}

function sportStats(sport){
  const s = {points:0, picks:0, wins:0, winsPts:0, dh:0};
  for(const id of Object.keys(save.picks)){
    const p = save.picks[id];
    if(p.sport !== sport || p.pts === null || p.pts === undefined) continue;
    s.picks++; s.points += p.pts;
    if(p.winnerSide && p.side === p.winnerSide) s.wins++;
    if(p.pts > 0) s.winsPts++;
    if(p.dh) s.dh++;
  }
  return s;
}
function myCard(){
  const per = {}; let tot = {points:0, picks:0, wins:0, winsPts:0, dh:0};
  for(const k of Object.keys(SPORTS)){ per[k] = sportStats(k);
    tot.points += per[k].points; tot.picks += per[k].picks; tot.wins += per[k].wins; tot.winsPts += per[k].winsPts; tot.dh += per[k].dh; }
  return {name: save.name || "A Fan", per: per, tot: tot};
}
function rankTitle(points){
  if(points >= 6000) return "Yardstick Master";
  if(points >= 3000) return "Yard Leader";
  if(points >= 1500) return "Contender";
  if(points >= 750) return "Sharp";
  if(points >= 250) return "Regular";
  return "Rookie";
}
function rankEmoji(points){
  if(points >= 6000) return "🏆";
  if(points >= 3000) return "👑";
  if(points >= 1500) return "🔥";
  if(points >= 750) return "🎯";
  if(points >= 250) return "⭐";
  return "🌱";
}
function trophyCase(){
  const c = myCard(); const t = c.tot;
  const sportsPlayed = Object.keys(SPORTS).filter(k => c.per[k].picks > 0).length;
  const byWeek = {};
  for(const id of Object.keys(save.picks)){ const p = save.picks[id];
    if(p.pts !== null && p.pts !== undefined) byWeek[p.week] = (byWeek[p.week] || 0) + p.pts; }
  const bestWeek = Math.max.apply(null, [0].concat(Object.values(byWeek)));
  const graded = Object.values(save.picks).filter(p => p.pts !== null && p.pts !== undefined).sort((a, b) => new Date(a.date) - new Date(b.date));
  let streak = 0, best = 0;
  for(const p of graded){ if(p.pts > 0){ streak++; if(streak > best) best = streak; } else streak = 0; }
  return [
    {emo:"🏟️", name:"In the Yard", desc:"Score your first points", got: t.points > 0},
    {emo:"💎", name:"Direct Hit", desc:"Call an exact margin", got: t.dh >= 1},
    {emo:"🔥", name:"On Fire", desc:"Score in 5 straight graded picks", got: best >= 5},
    {emo:"💯", name:"Century Week", desc:"100+ points in one week", got: bestWeek >= 100},
    {emo:"🌎", name:"Full Yard", desc:"Score in all five sports", got: sportsPlayed >= 5},
    {emo:"🎯", name:"Sharpshooter", desc:"Land 5 Direct Hits", got: t.dh >= 5},
    {emo:"⭐", name:"Regular", desc:"Reach 250 total points", got: t.points >= 250},
    {emo:"👑", name:"Yard Leader", desc:"Reach 3,000 total points", got: t.points >= 3000},
    {emo:"🏆", name:"Yardstick Master", desc:"Reach 6,000 total points", got: t.points >= 6000}
  ];
}
function pct(a, b){ return b ? Math.round(100 * a / b) : 0; }
function statBars(label, rows){
  let h = '<div class="card"><div class="rankline">' + label + '</div>';
  for(const r of rows){
    h += '<div class="statbar"><span>' + r[0] + '</span><span class="track"><span class="fill" style="display:block;width:' + r[1] + '%"></span></span><span class="v">' + r[1] + '%</span></div>';
  }
  return h + '</div>';
}
function renderYard(){
  const v = document.getElementById("view");
  const card = myCard();
  let h = '<div class="card"><div class="rankline">MY SCORE CARD</div>' +
    '<div style="margin:10px 0"><input type="text" id="fanName" placeholder="Your fan name" value="' + esc(save.name) + '"></div>' +
    '<div class="rankline">Rank: ' + rankEmoji(card.tot.points) + ' <b>' + rankTitle(card.tot.points) + '</b> · ' + card.tot.points + ' total points · ' + card.tot.dh + ' Direct Hits</div></div>';
  h += '<div class="card"><table><tr><th>LEAGUE</th><th>POINTS</th><th>PICKS</th><th>WINS</th><th>WIN %</th><th>WINS W/ PTS %</th><th>DIRECT HITS</th></tr>';
  for(const k of Object.keys(SPORTS)){
    const s = card.per[k];
    h += '<tr><td>' + SPORTS[k].label + '</td><td>' + s.points + '</td><td>' + s.picks + '</td><td>' + s.wins + '</td><td>' + pct(s.wins, s.picks) + '%</td><td>' + pct(s.winsPts, s.picks) + '%</td><td>' + s.dh + '</td></tr>';
  }
  h += '<tr style="font-weight:900"><td>ALL YARDS</td><td>' + card.tot.points + '</td><td>' + card.tot.picks + '</td><td>' + card.tot.wins + '</td><td>' + pct(card.tot.wins, card.tot.picks) + '%</td><td>' + pct(card.tot.winsPts, card.tot.picks) + '%</td><td>' + card.tot.dh + '</td></tr></table></div>';
  const rows = [];
  for(const k of Object.keys(SPORTS)){ const s = card.per[k]; if(s.picks) rows.push([SPORTS[k].label + " WIN %", pct(s.wins, s.picks)]); }
  if(rows.length) h += statBars("MY PREDICTION PERCENTS", rows);
  const dhRows = [];
  for(const k of Object.keys(SPORTS)){ const s = card.per[k]; if(s.picks) dhRows.push([SPORTS[k].label + " DIRECT HIT %", pct(s.dh, s.picks)]); }
  if(dhRows.length) h += statBars("DIRECT HIT PERCENTS", dhRows);
  const tc = trophyCase();
  h += '<div class="card"><div class="rankline">🏆 TROPHY CASE · ' + tc.filter(x => x.got).length + ' of ' + tc.length + ' earned</div><div class="trophies">' +
    tc.map(x => '<div class="trophy' + (x.got ? '' : ' locked') + '"><div class="emo">' + x.emo + '</div><div class="tname">' + x.name + '</div><div class="tdesc">' + x.desc + '</div></div>').join("") + '</div></div>';
  // Yard Board
  const board = [card].concat(save.board || []).slice().sort((a, b) => b.tot.points - a.tot.points);
  h += '<div class="card"><div class="rankline">THE YARD BOARD</div><table><tr><th>RANK</th><th>FAN</th><th>TITLE</th><th>POINTS</th><th>PICKS</th><th>WIN %</th><th>DIRECT HITS</th></tr>';
  board.forEach((c, i) => { const medal = i === 0 ? "🏆" : i === 1 ? "🥈" : i === 2 ? "🥉" : String(i + 1);
    h += '<tr><td>' + medal + '</td><td>' + esc(c.name) + (c.name === card.name ? " (you)" : "") + '</td><td>' + rankEmoji(c.tot.points) + ' ' + rankTitle(c.tot.points) + '</td><td>' + c.tot.points + '</td><td>' + c.tot.picks + '</td><td>' + pct(c.tot.wins, c.tot.picks) + '%</td><td>' + c.tot.dh + '</td></tr>'; });
  h += '</table><div class="small mut" style="margin-top:8px">Trade season codes with friends: their card joins your board, yours joins theirs. The weekly leaderboard lives on Facebook, cards posted every Monday.</div>' +
    '<button class="btn" id="shareBtn">SHARE MY CARD</button> <button class="btn ghost" id="copyBtn">COPY MY SEASON CODE</button>' +
    '<div class="sharebox" id="shareBox"></div>' +
    '<div style="margin-top:14px"><input type="text" id="importBox" placeholder="Paste a friend\'s FY- season code"></div>' +
    '<button class="btn ghost small" id="importBtn">ADD TO THE BOARD</button> <span class="small" id="importMsg"></span></div>';
  h += '<div class="card"><div class="rankline">HOW SCORING WORKS</div><div class="small" style="line-height:1.7;margin-top:6px">' +
    'Pick the winner and call the margin. Beat the number, bank the points: an exact margin is a <b style="color:var(--gold)">Direct Hit, 100 points</b>. ' +
    'Every point you are off inside ten costs 10: off by 1 scores 90, off by 2 scores 80, and so on. Miss the winner, or land outside ten, and the game scores 0. No negatives, ever. ' +
    'The Yardstick is the posted line for the game, the market\'s collective call on the margin, shown so you can measure your call against the crowd\'s number.</div></div>';
  v.innerHTML = h;
  const nameInput = document.getElementById("fanName");
  nameInput.addEventListener("change", () => { save.name = nameInput.value.trim(); store(); refresh(false); });
  document.getElementById("shareBtn").addEventListener("click", () => {
    const c = myCard();
    const text = "🏟️ FAN YARD · " + c.name + " · " + rankEmoji(c.tot.points) + " " + rankTitle(c.tot.points) + "\n" + c.tot.points + " points · " + c.tot.picks + " picks · " + pct(c.tot.wins, c.tot.picks) + "% winners · " + c.tot.dh + " Direct Hits · " + trophyCase().filter(x => x.got).length + " trophies 🏆\nPick the winner. Call the margin. Measure up: https://bizzybullets.github.io/fan-yard/";
    const box = document.getElementById("shareBox"); box.style.display = "block"; box.textContent = text;
    if(navigator.share){ navigator.share({title:"Fan Yard", text:text}).catch(() => {}); }
  });
  document.getElementById("copyBtn").addEventListener("click", () => {
    const code = seasonCode();
    const box = document.getElementById("shareBox"); box.style.display = "block"; box.textContent = code;
    if(navigator.clipboard) navigator.clipboard.writeText(code).catch(() => {});
  });
  document.getElementById("importBtn").addEventListener("click", () => {
    const msg = document.getElementById("importMsg");
    const raw = document.getElementById("importBox").value.trim();
    try{
      const c = JSON.parse(atob(raw.replace(/^FY-/, "")));
      if(!c || !c.tot || typeof c.tot.points !== "number" || !c.name) throw new Error("bad");
      save.board = (save.board || []).filter(b => b.name !== c.name);
      save.board.push(c); store(); msg.textContent = "Added " + c.name + "."; refresh(false);
    }catch(e){ msg.textContent = "That code did not read. Check it and try again."; }
  });
}
function seasonCode(){
  const c = myCard();
  return "FY-" + btoa(JSON.stringify(c));
}
function render(){
  renderNav(); setUpdated();
  if(view === "LIVE") renderLive();
  else if(view === "YARD") renderYard();
  else renderSport(view);
}
async function refresh(rerender){
  if(view === "LIVE"){ await Promise.all(Object.keys(SPORTS).map(fetchSport)); }
  else if(view !== "YARD"){ await fetchSport(view); }
  render();
}
function scheduleAuto(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    let anyLive = false;
    for(const k of Object.keys(feed)){ for(const ev of feed[k].events || []) if(ev.state === "in") anyLive = true; }
    if(view === "LIVE" || anyLive) refresh(false);
  }, 45000);
}
refresh(true);
scheduleAuto();
</script>
